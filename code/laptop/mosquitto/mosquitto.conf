# OptiProductio Mosquitto config (Mosquitto 2.x).
# Mosquitto 2 only listens on localhost unless told otherwise, so the NodeMCU
# could not reach it. These two lines open port 1883 to the hotspot network.
listener 1883 0.0.0.0
allow_anonymous true

# Safer option for later: create a password file with
#   mosquitto_passwd -c passwords.txt optiproductio
# then replace "allow_anonymous true" with:
#   allow_anonymous false
#   password_file passwords.txt
# and put the same user/password in nodemcu_gateway/config.h and run.py --mqtt-user/--mqtt-password.
